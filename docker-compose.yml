name: antar-model-disagreement-explorer

services:
  backend:
    build:
      context: ./backend
    command:
      - uvicorn
      - api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --reload
      - --reload-dir
      - /app/api
      - --reload-dir
      - /app/mde
    environment:
      MDE_DATA_DIR: /app/data
      MDE_N_JOBS: "1"
    volumes:
      - ./data:/app/data
      - ./backend/api:/app/api
      - ./backend/mde:/app/mde
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
